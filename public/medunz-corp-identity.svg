<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Medunz Corp. — Una mirada que transforma</title>
  <desc id="desc">Imagen corporativa de Medunz Corp. con una representación elegante de Medusa en azul marino, marfil y dorado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".58" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="halo" cx=".7" cy=".45" r=".48">
      <stop offset="0" stop-color="#dce8f2" stop-opacity=".95"/>
      <stop offset=".66" stop-color="#eef3f7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f7445"/>
      <stop offset=".45" stop-color="#d6bc7b"/>
      <stop offset="1" stop-color="#a8864c"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2647"/>
      <stop offset="1" stop-color="#153a63"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10233d" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#halo)"/>

  <g opacity=".65" fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M0 525 C270 430 410 555 640 470 S1060 355 1600 460" stroke-width="2"/>
    <path d="M0 555 C260 465 420 585 665 495 S1070 390 1600 495" stroke-width="1.3"/>
  </g>

  <g transform="translate(80 65)">
    <text x="0" y="30" font-family="Inter, Arial, sans-serif" font-size="14" letter-spacing="5" fill="#b59a6b">MEDUNZ CORP. · BOLIVIA</text>
    <text x="0" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="126" font-weight="700" fill="#102e52">MED</text>
    <text x="292" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="126" font-weight="700" fill="url(#gold)">U</text>
    <text x="382" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="126" font-weight="700" fill="#102e52">NZ</text>
    <line x1="0" y1="175" x2="520" y2="175" stroke="url(#gold)" stroke-width="3"/>
    <text x="185" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="16" fill="#102e52">CORP.</text>
    <text x="0" y="258" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="7" fill="#24486d">UNA MIRADA QUE TRANSFORMA</text>

    <text x="0" y="320" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334b65">Tecnología, salud, naturaleza, educación y bienestar</text>
    <text x="0" y="350" font-family="Inter, Arial, sans-serif" font-size="20" fill="#334b65">para transformar realidades.</text>

    <rect x="0" y="390" width="300" height="54" rx="27" fill="#102e52"/>
    <text x="32" y="424" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.5" fill="#ffffff">CONOCER NUESTRO GRUPO</text>
    <path d="M264 405 l12 12 l-12 12" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <g transform="translate(790 25)" filter="url(#shadow)">
    <circle cx="270" cy="270" r="235" fill="#10233f" stroke="url(#gold)" stroke-width="10"/>
    <circle cx="270" cy="270" r="214" fill="none" stroke="#d8bd7c" stroke-width="2" opacity=".8"/>

    <!-- serpents -->
    <g fill="none" stroke="#d8bd7c" stroke-width="14" stroke-linecap="round">
      <path d="M118 180 C45 135 38 72 95 52 C135 38 167 66 155 100 C144 132 100 139 82 112"/>
      <path d="M422 180 C495 135 502 72 445 52 C405 38 373 66 385 100 C396 132 440 139 458 112"/>
      <path d="M102 285 C42 260 20 296 44 324 C72 358 129 344 141 309 C151 280 180 260 214 270"/>
      <path d="M438 285 C498 260 520 296 496 324 C468 358 411 344 399 309 C389 280 360 260 326 270"/>
      <path d="M150 410 C98 432 99 492 145 506 C188 519 217 484 196 452 C178 424 187 392 220 372"/>
      <path d="M390 410 C442 432 441 492 395 506 C352 519 323 484 344 452 C362 424 353 392 320 372"/>
      <path d="M270 42 C228 11 208 44 229 68 C248 89 277 81 282 57"/>
    </g>

    <!-- medusa face -->
    <path d="M204 160 C220 123 246 106 270 106 C294 106 320 123 336 160 L325 288 C317 350 300 399 270 433 C240 399 223 350 215 288 Z"
          fill="#f5f2eb" stroke="url(#gold)" stroke-width="6"/>
    <path d="M220 204 C236 190 252 187 270 195 C288 187 304 190 320 204" fill="none" stroke="#10233f" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="244" cy="220" rx="13" ry="9" fill="#10233f"/>
    <ellipse cx="296" cy="220" rx="13" ry="9" fill="#10233f"/>
    <circle cx="244" cy="220" r="3" fill="#d7bd7c"/>
    <circle cx="296" cy="220" r="3" fill="#d7bd7c"/>
    <path d="M270 231 C263 260 263 277 270 289 C277 277 277 260 270 231" fill="none" stroke="#10233f" stroke-width="5" stroke-linecap="round"/>
    <path d="M241 329 C258 343 282 343 299 329" fill="none" stroke="#10233f" stroke-width="6" stroke-linecap="round"/>
    <path d="M236 354 C253 365 287 365 304 354" fill="none" stroke="#c0a363" stroke-width="4" stroke-linecap="round"/>

    <!-- snakes around face -->
    <g fill="none" stroke="#f0e6d1" stroke-width="10" stroke-linecap="round">
      <path d="M170 150 C145 128 155 101 178 99 C198 98 210 114 204 130"/>
      <path d="M370 150 C395 128 385 101 362 99 C342 98 330 114 336 130"/>
      <path d="M158 358 C132 372 136 399 161 407 C183 414 197 397 190 380"/>
      <path d="M382 358 C408 372 404 399 379 407 C357 414 343 397 350 380"/>
    </g>
  </g>

  <g transform="translate(1320 115)">
    <line x1="0" y1="0" x2="0" y2="155" stroke="url(#gold)" stroke-width="3"/>
    <text x="30" y="28" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.5" fill="#102e52">NUESTRO ECOSISTEMA</text>
    <text x="30" y="70" font-family="Inter, Arial, sans-serif" font-size="16" fill="#37526f">Seis unidades de negocio</text>
    <text x="30" y="98" font-family="Inter, Arial, sans-serif" font-size="16" fill="#37526f">que comparten un mismo propósito:</text>
    <text x="30" y="126" font-family="Inter, Arial, sans-serif" font-size="16" fill="#37526f">transformar realidades a través de</text>
    <text x="30" y="154" font-family="Inter, Arial, sans-serif" font-size="16" fill="#37526f">soluciones innovadoras, humanas</text>
    <text x="30" y="182" font-family="Inter, Arial, sans-serif" font-size="16" fill="#37526f">y sostenibles.</text>
  </g>
</svg>