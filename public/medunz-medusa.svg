<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="t d">
  <title id="t">Medunz Corp. — Medusa emblem</title>
  <desc id="d">Medusa clásica estilizada con serpientes doradas sobre medallón azul marino.</desc>
  <defs>
    <radialGradient id="navy" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#17365d"/>
      <stop offset="1" stop-color="#071a31"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a77d36"/>
      <stop offset=".28" stop-color="#e7cb88"/>
      <stop offset=".55" stop-color="#c5a45d"/>
      <stop offset=".82" stop-color="#f0d99d"/>
      <stop offset="1" stop-color="#9a7334"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset=".55" stop-color="#f1ece1"/>
      <stop offset="1" stop-color="#d8d0c1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071a31" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Refined medallion -->
  <circle cx="400" cy="400" r="350" fill="url(#navy)" stroke="url(#gold)" stroke-width="14" filter="url(#shadow)"/>
  <circle cx="400" cy="400" r="321" fill="none" stroke="#e2c987" stroke-width="2" opacity=".9"/>
  <circle cx="400" cy="400" r="307" fill="none" stroke="#7890aa" stroke-width="1" opacity=".38"/>

  <!-- Clearly readable serpents framing the face -->
  <g fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M306 218 C249 180 176 181 145 128 C126 95 144 61 176 61 C207 61 219 91 200 111"/>
    <path d="M494 218 C551 180 624 181 655 128 C674 95 656 61 624 61 C593 61 581 91 600 111"/>
    <path d="M270 302 C215 264 137 276 111 328 C94 363 119 395 151 386 C179 378 184 348 164 331"/>
    <path d="M530 302 C585 264 663 276 689 328 C706 363 681 395 649 386 C621 378 616 348 636 331"/>
    <path d="M278 466 C221 465 168 503 172 550 C175 586 214 598 235 573 C252 553 242 529 220 522"/>
    <path d="M522 466 C579 465 632 503 628 550 C625 586 586 598 565 573 C548 553 558 529 580 522"/>
  </g>

  <!-- Small serpent heads -->
  <g fill="#f7edda" stroke="#b08a48" stroke-width="5">
    <path d="M176 61 C154 55 141 38 150 20 C160 1 187 4 196 21 C204 37 193 56 176 61Z"/>
    <path d="M624 61 C646 55 659 38 650 20 C640 1 613 4 604 21 C596 37 607 56 624 61Z"/>
    <path d="M111 328 C91 318 73 326 68 344 C63 363 79 378 97 374 C113 371 121 349 111 328Z"/>
    <path d="M689 328 C709 318 727 326 732 344 C737 363 721 378 703 374 C687 371 679 349 689 328Z"/>
  </g>

  <!-- Classical hair silhouette -->
  <path d="M276 212 C301 155 350 124 400 124 C450 124 499 155 524 212
           C548 268 535 337 505 391 C487 424 474 451 468 485
           C438 505 362 505 332 485 C326 451 313 424 295 391
           C265 337 252 268 276 212Z" fill="#102b4d" stroke="#d7bb78" stroke-width="8"/>

  <!-- Face -->
  <path d="M318 220 C336 181 367 159 400 159 C433 159 464 181 482 220
           C491 268 484 327 469 378 C456 421 435 456 400 480
           C365 456 344 421 331 378 C316 327 309 268 318 220Z"
        fill="url(#ivory)" stroke="#d7bb78" stroke-width="5"/>

  <!-- Eyes -->
  <g fill="none" stroke="#10243e" stroke-linecap="round">
    <path d="M337 267 C354 251 375 251 391 263" stroke-width="8"/>
    <path d="M409 263 C425 251 446 251 463 267" stroke-width="8"/>
    <path d="M341 287 C355 276 375 276 388 287 C375 299 355 299 341 287Z" stroke-width="4" fill="#fff"/>
    <path d="M412 287 C425 276 445 276 459 287 C445 299 425 299 412 287Z" stroke-width="4" fill="#fff"/>
  </g>
  <ellipse cx="365" cy="287" rx="6" ry="8" fill="#10243e"/>
  <ellipse cx="435" cy="287" rx="6" ry="8" fill="#10243e"/>

  <!-- Nose and mouth, restrained classical treatment -->
  <path d="M400 286 C395 313 391 340 398 356 C402 364 410 363 414 355" fill="none" stroke="#26364a" stroke-width="5" stroke-linecap="round"/>
  <path d="M367 395 C378 388 390 387 400 392 C410 387 422 388 433 395 C421 405 379 405 367 395Z" fill="#c1b3a2" stroke="#172a43" stroke-width="3"/>
  <path d="M374 425 C389 435 411 435 426 425" fill="none" stroke="#aa8a55" stroke-width="4" stroke-linecap="round"/>
  <path d="M400 188 l8 13 -8 13 -8-13Z" fill="#d7bb78"/>

  <!-- Subtle decorative dots -->
  <g fill="#d8bd79" opacity=".72">
    <circle cx="291" cy="235" r="4"/><circle cx="277" cy="263" r="3"/>
    <circle cx="509" cy="235" r="4"/><circle cx="523" cy="263" r="3"/>
    <circle cx="295" cy="401" r="3"/><circle cx="505" cy="401" r="3"/>
  </g>
</svg>
