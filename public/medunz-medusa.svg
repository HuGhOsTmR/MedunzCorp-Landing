<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="t d">
  <title id="t">Medusa — Medunz Corp.</title>
  <desc id="d">Emblema clásico y elegante de Medusa en azul marino, marfil y dorado.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#203a5d"/>
      <stop offset=".72" stop-color="#102746"/>
      <stop offset="1" stop-color="#0a1a31"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
